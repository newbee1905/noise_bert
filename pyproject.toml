[project]
name = "noise-bert"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pandas>=3.0.3",
    "pyspellchecker>=0.9.0",
    "ruff>=0.15.14",
    "tensorflow>=2.21.0",
    "tensorflow-hub>=0.16.1",
    "textattack>=0.3.10",
    "torch>=2.11",
    "torchvision>=0.27.0",
    "transformers>=4.57.6",
    "wandb>=0.27.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"
